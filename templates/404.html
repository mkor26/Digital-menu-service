{% extends "base.html" %}

{% block title %}Страница не найдена - 404{% endblock %}

{% block content %}
    <div class="text-center mt-5">
        <h1 class="display-1 text-danger">404</h1>
        <h2 class="mb-4">Страница не найдена</h2>
        <p class="lead">Возможно, вы ошиблись в адресе или страница была удалена.</p>
        <a href="{% url 'homepage:index' %}" class="btn btn-primary mt-3">
            Вернуться на главную
        </a>
    </div>
{% endblock %}
